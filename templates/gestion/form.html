{% extends 'base.html' %}{% block content %}<div class="card mx-auto" style="max-width:760px"><div class="card-body"><h1 class="h3">{{ titulo }}</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="mb-3">{{ field.label_tag }} {{ field }}<div class="text-danger">{{ field.errors }}</div>{% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}</div>{% endfor %}<button class="btn btn-primary">Guardar</button> <a class="btn btn-outline-secondary" href="{{ volver }}">Cancelar</a></form></div></div>{% endblock %}
